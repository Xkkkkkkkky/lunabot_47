# 歌曲别名配置：按游戏原始整数 ID 填写，ID 对应 MasterLiveMusic.id（非谱面 ID）。
# 适用于歌曲、曲绘、歌曲列表、效率及关联活动/剧情；精确匹配与原曲名等价。
# 仅添加别名，无需抄写原名；现有查询支持简繁转换及英文大小写不敏感。
# 保存后约 3 秒内，后续查询生效。
# 同一 ID 写在一个条目中；别名写字符串。
# 避免纯数字、m/c/e+数字，以及 p2/ex/lv26/free/sort= 等命令参数，避免与解析参数冲突。
# 配置示例（以下整段仅为注释，不会启用假数据）：
# aliases:
#   - id: 1
#     aliases:
#       - "别名一"
#       - "别名二"
aliases: []
