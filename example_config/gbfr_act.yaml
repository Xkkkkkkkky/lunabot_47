# GBFR 并非默认必需服务；未运行 GBFR ACT 时应关闭，避免反复连接不存在的 WebSocket。
battle:
  idle_check_interval_seconds: 15
  idle_finish_seconds: 120              # 最后一次伤害后等待此时间，然后批量写入 raw/logs
  min_damage: 0
  ignore_non_party_sources: true
  ignored_target_type_ids: []

websocket:
  enable: false
  # 启用时在真实 config 中填写 WebSocket 服务地址。
  url: ""
  heartbeat_seconds: 30
  reconnect_seconds: 5
  error_log_limit: 5

storage:
  base_dir: "data/gbfr"
  keep_battles: 100

subscribe:
  auto_send: true
  auto_send_delay_seconds: 1

# 与 STA/NSY 共用全局绘图主题；留空时继承 global.draw 配置。
draw:
  background_image: ""
  theme: {}

render:
  width: 1280
  chart_bucket_seconds: 2
  top_actor_count: 4
  top_action_count: 5
  show_username: true
  low_quality: true
