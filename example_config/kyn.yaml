# 当前仅支持 dp；不能填写尚未实现的算法名称。
algorithm: dp
# 各算法的参数在此独立分组；未来新增算法也使用自己的分组。
algorithms:
  dp:
    # 搜索时间预算，单位秒，须为有限非负数。0 关闭搜索，仅返回已有合法上界或确定性构造；最优缓存仍直接复用。
    # 这不是总回复耗时的硬上限，验证、读写、排队等操作可能增加耗时。
    timeout_seconds: 3.0
    # 每个区间的状态上限，须为非负整数，0 关闭搜索。精确 DP 预计算 947947 需要 11041 个状态，全部相位最多 11181 个。
    # 较小的限额可能导致无法证明最优性。
    max_states_per_interval: 16000
    # 全局候选对展开上限，须为非负整数，0 关闭搜索。
    max_pair_expansions: 1000000
    # 搜索缓存及保留节点的保守内存估算上限，单位 MiB（1024^2 字节），须为有限非负数，0 关闭搜索。
    # 这不是机器人进程的总内存上限。
    max_memory_mb: 128.0
    # 目标搜索的 947 组数上限，接受非负整数或 a；0 关闭目标搜索，不限制确定性构造或已保存结果的组数。
    # a 按 abs(目标) 的十进制位数最大值计算：设其 252 进制位数为 L，已验证余数构造最坏组数为 M，上限为 M*L+(L-1)。
    # 当前 0..251 已实际验证 M=3；20 位最大值需要 9 位 252 进制，因此理论搜索上限为 35。
    # 实际搜索还受本次更好合法上界的组数减 1 限制，不会逐组枚举到 35。
    # 余数构造字典独立进行一次性初始化；冷启动耗时另行统计，不计入目标搜索预算。
    max_cycles_search: a
    # 每个目标导向商余分解节点优先展开的候选除数数量，须为正整数。
    quotient_candidates: 24
    # 单次目标搜索最多展开的商余分解节点数，须为正整数，同时受全局时间、候选对和内存上限约束。
    quotient_nodes: 256
    # 每个 Beam 子区间的候选宽度上限，须为正整数，同时受 max_states_per_interval 约束。
    beam_width: 128
    # 每个近似区间展开候选对的上限，须为正整数，同时受剩余全局预算约束。
    beam_max_pair_expansions_per_interval: 1024
    # 累计展开多少对候选后检查一次时间和内存，须为正整数；数值越小，检查越频繁。插入保留状态时也会检查。
    budget_check_interval: 64
