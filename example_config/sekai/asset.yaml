# PJsk 总开关关闭时本文件不会加载；保留完整键供以后显式启用时使用。
debug: false
default_masterdata_update_check_timeout: 3    # 默认MasterData数据源检查更新超时时间（秒）
default_masterdata_download_timeout: 10       # 默认MasterData下载超时时间（秒）
default_rip_asset_download_timeout: 60        # 默认解包资源下载超时时间（秒）
rip_img_cache_max_res: 256*256                # 解包资源图片缓存最大分辨率
debug_log_img_cache: false                    # 是否启用解包资源图片缓存调试日志

# 日服
jp:
  masterdata:
    sources:
      # Haruki 仓库仅提供日服实时 MasterData；请在真实 config 中填写地址。
      - name: "haruki"
        base_url: ""
        version_url: ""

  rip:  # 解包资源数据源
    sources:
      # name 必须保持为 sekai.best；请在真实 config 中填写资源地址。
      - name: "sekai.best"
        base_url: ""

# 其他区服与日服使用相同字段；各区服的数据源地址只写在真实 config。
en:
  masterdata:
    sources:
      - name: "sekai-world-en"
        base_url: ""
        version_url: ""
  rip:
    sources:
      - name: "sekai.best"
        base_url: ""

