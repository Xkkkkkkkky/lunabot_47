# 日服
jp:
  # 游戏 API 地址仅填写在真实 config 中，示例不携带占位网址。
  api_status_url:               ""  # 游戏 API 状态
  profile_api_url:                ""  # 游戏API: 获取用户profile
  suite_api_url:                  ""  # 游戏API: 获取用户suite
  ranking_top100_api_url:         ""  # Haruki 游戏API: 活动 Top100
  ranking_border_api_url:         ""  # Haruki 游戏API: 活动档线
  
  # profile/榜线使用 sekai.yaml 中的 gameapi_token，通过 X-Haruki-Sekai-Token 认证。
  # Toolbox 公共 suite 不携带令牌，需要用户自行开启公共 API 访问。
  # suite数据需要包含upload_time字段，内容为单位为毫秒的时间戳。
  # 目前使用到的suite数据字段：'userCards','userDecks','userGamedata','userMusics','userMusicResults','userAreas','userChallengeLiveSoloDecks','userCharacters','userMysekaiFixtureGameCharacterPerformanceBonuses','userWorldBloomSupportDecks','userHonors','userChallengeLiveSoloResults','userChallengeLiveSoloStages','userChallengeLiveSoloHighScoreRewards','userEvents','userWorldBlooms','userMusicAchievements','userPlayerFrames','userMaterials','upload_time',
  # 字节服suite数据中的compact格式字段需要处理为日服同格式

