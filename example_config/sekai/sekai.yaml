# PJSK 总开关。关闭后不加载插件后台任务，独立组卡及榜线服务也拒绝启动；修改后需重启相关进程。
enabled: false

# 轻量模式开关；开启后仅响应下方显式开启的指令。关闭时保留原有指令响应范围。
# 指令响应开关修改后需重启生效；帮助显示按当前配置更新。
# 缺失项视为关闭，别名及区服/WL前缀共用开关。
# enabled、ranking_enabled、deck_enabled、区服及群白名单等原有限制仍然生效。
# 帮助按当前轻量模式及逐指令开关动态筛选；后台数据更新和已有订阅通知不受影响。
